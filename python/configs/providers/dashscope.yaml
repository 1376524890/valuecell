# ============================================
# DashScope Provider Configuration
# ============================================
name: "DashScope"
provider_type: "dashscope"

enabled: true # Default is true if not specified

# Connection Configuration
connection:
  base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
  api_key_env: "DASHSCOPE_API_KEY"

# Default model if none specified
default_model: "qwen3-max"

# Model Parameters Defaults
defaults:
  temperature: 0.7
  max_tokens: 4096

# Available Models (commonly used)
models:
  - id: "qwen3-max"
    name: "Qwen3 Max"
    context_length: 32768

  - id: "qwen3-plus"
    name: "Qwen3 Plus"
    context_length: 131072

  - id: "qwen3-turbo"
    name: "Qwen3 Turbo"
    context_length: 131072

  - id: "qwen2.5-72b-instruct"
    name: "Qwen2.5 72B Instruct"
    context_length: 131072

# ============================================
# Embedding Models Configuration
# ============================================
# DashScope provides embedding models
embedding:
  # Default embedding model
  default_model: "text-embedding-v2"
  
  # Default parameters
  defaults:
    dimensions: 1536
    encoding_format: "float"
  
  # Available embedding models
  models:
    - id: "text-embedding-v2"
      name: "Text Embedding V2"
      dimensions: 1536
      max_input: 4096
      description: "DashScope Text Embedding Model V2"

    - id: "text-embedding-async-v4"
      name: "Text Embedding Async V4"
      dimensions: 1536
      max_input: 8192
      description: "DashScope Text Embedding Model Async V4"