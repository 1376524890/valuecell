# ============================================
# OpenAI Compatible API Provider Configuration
# ============================================
# This configuration supports any OpenAI-compatible API including:
# - DashScope (阿里云通义千问)
# - Other OpenAI-compatible services

#
# Usage for DashScope:
#   1. Set OPENAI_COMPATIBLE_BASE_URL=https://dashscope.aliyuncs.com/compatible-mode/v1
#   2. Set OPENAI_COMPATIBLE_API_KEY=your-dashscope-api-key
#   3. Set PRIMARY_PROVIDER=openai-compatible
#
# Example:
#   export OPENAI_COMPATIBLE_BASE_URL=https://dashscope.aliyuncs.com/compatible-mode/v1
#   export OPENAI_COMPATIBLE_API_KEY=your-dashscope-api-key
#   export PRIMARY_PROVIDER=openai-compatible

name: "OpenAI-Compatible"
provider_type: "openai-compatible"

enabled: true

# Connection Configuration
connection:
  # Use environment variable with fallback to DashScope
  base_url: "${OPENAI_COMPATIBLE_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}"
  api_key_env: "OPENAI_COMPATIBLE_API_KEY"

# Default model if agents.yaml specified
default_model: "qwen3-max"

# Model Parameters Defaults
defaults:
  temperature: 0.7
  max_tokens: 4096

# Available Models (DashScope models)
models:
  - id: "qwen3-max"
    name: "Qwen3 Max"
    context_length: 8192
    description: "通义千问Max模型"
  - id: "qwen-plus"
    name: "Qwen Plus"
    context_length: 8192
    description: "通义千问Plus模型"
  - id: "qwen-turbo"
    name: "Qwen Turbo"
    context_length: 8192
    description: "通义千问Turbo模型"
  - id: "qwen-long"
    name: "Qwen Long"
    context_length: 32768
    description: "通义千问Long模型"
  - id: "qwen3-vl-plus"
    name: "Qwen3 VL Plus"
    context_length: 8192
    description: "通义千问视觉模型Plus版本"

# ============================================
# Embedding Models Configuration
# ============================================
# Note: Embedding support for DashScope

embedding:
  # Default embedding model
  default_model: "text-embedding-v4"
  
  # Default parameters
  defaults:
    dimensions: 1536
    encoding_format: "float"
  
  # Available embedding models
  models:
    - id: "text-embedding-v4"
      name: "Text Embedding V4"
      dimensions: 1536
      max_input: 8192
      description: "DashScope文本嵌入模型V4版本"
